<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Login – HQ Strikepro</title>
  <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HQ STRIKEPRO" />
  <meta name="theme-color" content="#d4af37" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #E63946; --primary-dark: #c1121f;
      --bg: #0d0d0d; --surface: #1a1a1a; --surface2: #242424;
      --border: #2e2e2e; --text: #f1f1f1; --text-muted: #888;
      --input-bg: #111; --radius: 14px; --radius-sm: 8px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: 'IBM Plex Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; }
    .app { min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px 20px; }
    .logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 36px; }
    .logo-mark { width: 88px; height: 88px; background: transparent; border-radius: 18px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
    .logo-name { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
    .logo-name span { color: var(--primary); }
    .card { width: 100%; max-width: 400px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 24px; }
    .tabs { display: flex; background: var(--surface2); border-radius: var(--radius-sm);
      padding: 4px; margin-bottom: 28px; gap: 4px; }
    .tab { flex: 1; padding: 9px; border: none; border-radius: calc(var(--radius-sm) - 2px);
      font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s, color .2s;
      background: transparent; color: var(--text-muted); }
    .tab.active { background: var(--primary); color: #fff; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
    input { width: 100%; padding: 13px 14px; background: var(--input-bg);
      border: 1.5px solid var(--border); border-radius: var(--radius-sm); color: var(--text);
      font-size: 15px; outline: none; transition: border-color .2s; -webkit-appearance: none; }
    input::placeholder { color: #444; }
    input:focus { border-color: var(--primary); }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 44px; }
    .eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--text-muted);
      display: flex; align-items: center; padding: 4px; }
    .eye-btn:hover { color: var(--text); }
    .btn-primary { width: 100%; padding: 14px; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 6px; transition: background .2s, transform .1s; letter-spacing: .2px; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:active { transform: scale(.98); }
    .forgot { text-align: right; margin-top: -10px; margin-bottom: 18px; }
    .forgot a { font-size: 12px; color: var(--primary); text-decoration: none; }
    .alert { padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13px;
      margin-bottom: 16px; display: none; }
    .alert.error { background: rgba(230,57,70,.12); border: 1px solid rgba(230,57,70,.3); color: #ff6b76; }
    .alert.success { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); color: #4ade80; }
    .alert.show { display: block; }
    .strength-bar { display: flex; gap: 4px; margin-top: 8px; }
    .strength-bar span { flex: 1; height: 3px; border-radius: 2px; background: var(--border); transition: background .3s; }
    .strength-label { font-size: 11px; margin-top: 5px; color: var(--text-muted); }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
    }
    .shake { animation: shake .4s ease; }
    .home-fab{position:fixed;top:14px;left:14px;z-index:10;display:flex;align-items:center;justify-content:center;text-decoration:none;}
    .home-fab img{width:38px;height:38px;object-fit:contain;display:block;}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
<a href="/" class="home-fab" title="หน้าหลัก" aria-label="หน้าหลัก">
  <img src="/logo.png.png" alt="HQ Strikepro" />
</a>
<div class="app">
  <div class="logo">
    <div class="logo-mark">
      <img src="/logo.png.png" alt="HQ Strikepro" style="width:88px;height:88px;object-fit:contain;" />
    </div>
    <div class="logo-name">HQ <span>STRIKEPRO</span></div>
  </div>

  <div class="card" id="authCard">
    <div class="tabs" style="display:none">
      <button class="tab active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
      <button class="tab" id="tabRegister" onclick="location.href='/register'">Register</button>
    </div>
    <div class="alert" id="alert"></div>

    <form id="signinForm" style="display:none" onsubmit="handleSignIn(event)">
      <div class="form-group">
        <label for="siEmail">Strikepro Email</label>
        <input type="email" id="siEmail" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="siPassword">Password</label>
        <div class="password-wrap">
          <input type="password" id="siPassword" placeholder="Enter your password" autocomplete="current-password" required />
          <button type="button" class="eye-btn" onclick="togglePwd('siPassword', this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="forgot"><a href="#" onclick="return false;">Forgot password?</a></div>
      <button type="submit" id="btnSignIn" data-label="Sign In" class="btn-primary">Sign In</button>
    </form>

    <div id="lineSep" style="text-align:center;color:#a9a9a9;font-size:13px;margin:4px 0 16px;line-height:1.6;">เข้าสู่ระบบ / สมัครสมาชิก<br/>ด้วยบัญชี LINE ของคุณ</div>
    <button type="button" id="btnLine" onclick="location.href='/api/auth/line/start'"
      style="width:100%;background:#06C755;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;font-family:inherit;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 5.64 2 10.13c0 4.02 3.56 7.39 8.37 8.03.33.07.77.22.88.5.1.26.07.66.03.92l-.14.86c-.04.26-.2 1.02.9.56 1.1-.46 5.92-3.49 8.08-5.97C21.5 13.4 22 11.83 22 10.13 22 5.64 17.52 2 12 2zM8.3 12.6H6.36c-.28 0-.5-.23-.5-.5V8.24c0-.28.22-.5.5-.5s.5.22.5.5v3.35H8.3c.28 0 .5.22.5.5s-.22.51-.5.51zm1.96-.5c0 .27-.22.5-.5.5s-.5-.23-.5-.5V8.24c0-.28.22-.5.5-.5s.5.22.5.5v3.86zm4.66 0c0 .21-.14.4-.35.47a.5.5 0 0 1-.57-.18l-1.97-2.68v2.39c0 .27-.23.5-.5.5s-.5-.23-.5-.5V8.24c0-.21.14-.4.34-.47a.51.51 0 0 1 .58.18l1.97 2.68V8.24c0-.28.22-.5.5-.5s.5.22.5.5v3.86zm3.13-2.43c.28 0 .5.22.5.5s-.22.5-.5.5h-1.43v.93h1.43c.28 0 .5.22.5.5s-.22.5-.5.5h-1.93c-.27 0-.5-.23-.5-.5V8.24c0-.28.23-.5.5-.5h1.93c.28 0 .5.22.5.5s-.22.5-.5.5h-1.43v.93h1.43z"/></svg>
      เข้าสู่ระบบด้วย LINE
    </button>

    <div id="emailFallbackWrap" style="text-align:center;margin-top:18px;">
      <a href="#" id="emailFallback" onclick="showEmailLogin();return false;" style="font-size:12px;color:#777;text-decoration:underline;">เข้าสู่ระบบด้วยอีเมล (สำหรับแอดมิน)</a>
    </div>

    <form id="lineForm" style="display:none" onsubmit="handleLineComplete(event)">
      <p style="font-size:13px;color:#444;line-height:1.6;margin-bottom:14px;">
        เชื่อม LINE สำเร็จ ✅ — กรุณายืนยัน <b>อีเมลที่ใช้สมัคร StrikePro</b> เพื่อผูก/สร้างบัญชี
      </p>
      <div class="form-group">
        <label for="liEmail">Strikepro Email</label>
        <input type="email" id="liEmail" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <button type="button" id="btnLineOtp" onclick="sendLineOtp()"
        style="width:100%;background:#eee;color:#333;border:1px solid #ddd;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:14px;">ส่งรหัส OTP ไปที่อีเมล</button>
      <div class="form-group">
        <label for="liCode">รหัส OTP (6 หลัก)</label>
        <input type="text" id="liCode" inputmode="numeric" maxlength="6" placeholder="______" autocomplete="one-time-code" required />
      </div>
      <button type="submit" class="btn-primary">ยืนยันและเข้าสู่ระบบ</button>
    </form>

    <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="regEmail">Strikepro Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <div class="password-wrap">
          <input type="password" id="regPassword" placeholder="Create a password" autocomplete="new-password" oninput="checkStrength(this.value)" required />
          <button type="button" class="eye-btn" onclick="togglePwd('regPassword', this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength-bar"><span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>
      <div class="form-group">
        <label for="regConfirm">Confirm Password</label>
        <div class="password-wrap">
          <input type="password" id="regConfirm" placeholder="Repeat your password" autocomplete="new-password" required />
          <button type="button" class="eye-btn" onclick="togglePwd('regConfirm', this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" id="btnRegister" data-label="Create Account" class="btn-primary">Create Account</button>
    </form>
  </div>
</div>

<script>
  const API = '/api/auth';
  const TOKEN_KEY = 'sp_token';
  let LINE_PENDING = '';

  async function apiFetch(path, options = {}) {
    const token = localStorage.getItem(TOKEN_KEY);
    const res = await fetch(API + path, {
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
      ...options,
      body: options.body ? JSON.stringify(options.body) : undefined
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }

  function switchTab(tab) {
    clearAlert();
    document.getElementById('tabSignIn').classList.toggle('active', tab === 'signin');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    document.getElementById('signinForm').style.display  = tab === 'signin'   ? '' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? '' : 'none';
  }

  function showAlert(msg, type = 'error') {
    const el = document.getElementById('alert');
    el.textContent = msg; el.className = `alert ${type} show`;
  }
  function clearAlert() { document.getElementById('alert').className = 'alert'; }
  function shakeCard() {
    const card = document.getElementById('authCard');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }
  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.textContent = loading ? 'Please wait…' : btn.dataset.label;
  }
  function togglePwd(inputId, btn) {
    const input = document.getElementById(inputId);
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    btn.innerHTML = isText
      ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
      : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
  }
  function checkStrength(pwd) {
    let score = 0;
    if (pwd.length >= 8) score++;
    if (/[A-Z]/.test(pwd)) score++;
    if (/[0-9]/.test(pwd)) score++;
    if (/[^A-Za-z0-9]/.test(pwd)) score++;
    const colors = ['#E63946','#f4a261','#e9c46a','#4ade80'];
    ['s1','s2','s3','s4'].forEach((id, i) => {
      document.getElementById(id).style.background = i < score ? colors[score - 1] : 'var(--border)';
    });
    const label = document.getElementById('strengthLabel');
    label.textContent = pwd.length === 0 ? '' : ['Weak','Fair','Good','Strong'][score - 1] || 'Weak';
    label.style.color  = pwd.length === 0 ? '' : colors[score - 1] || colors[0];
  }

  async function handleRegister(e) {
    e.preventDefault(); clearAlert();
    const email = document.getElementById('regEmail').value.trim();
    const pwd   = document.getElementById('regPassword').value;
    const conf  = document.getElementById('regConfirm').value;
    if (pwd.length < 6) { showAlert('Password must be at least 6 characters.'); shakeCard(); return; }
    if (pwd !== conf)   { showAlert('Passwords do not match.');                  shakeCard(); return; }
    setLoading('btnRegister', true);
    try {
      const { token } = await apiFetch('/register', { method: 'POST', body: { email, password: pwd } });
      localStorage.setItem(TOKEN_KEY, token);
      showAlert('Account created! Signing you in…', 'success');
      setTimeout(() => { window.location.href = '/'; }, 800);
    } catch (err) { showAlert(err.message); shakeCard();
    } finally { setLoading('btnRegister', false); }
  }

  // Where to send the user after auth — honor a safe internal ?next=, else home
  function nextDest() {
    const n = new URLSearchParams(location.search).get('next');
    return (n && n.startsWith('/')) ? n : '/';
  }

  async function handleSignIn(e) {
    e.preventDefault(); clearAlert();
    const email = document.getElementById('siEmail').value.trim();
    const pwd   = document.getElementById('siPassword').value;
    setLoading('btnSignIn', true);
    try {
      const { token } = await apiFetch('/login', { method: 'POST', body: { email, password: pwd } });
      localStorage.setItem(TOKEN_KEY, token);
      window.location.href = nextDest();
    } catch (err) { showAlert(err.message); shakeCard();
    } finally { setLoading('btnSignIn', false); }
  }

  (async function init() {
    if (!localStorage.getItem(TOKEN_KEY)) return;
    try { await apiFetch('/me'); window.location.href = nextDest(); }
    catch { localStorage.removeItem(TOKEN_KEY); }
  })();

  // ── LINE Login ──────────────────────────────────────────────────────────────
  function showLineStep() {
    document.getElementById('signinForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'none';
    ['btnLine', 'lineSep', 'emailFallbackWrap'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
    const tabs = document.querySelector('.tabs'); if (tabs) tabs.style.display = 'none';
    document.getElementById('lineForm').style.display = '';
  }
  // discreet admin fallback: reveal the email/password form
  function showEmailLogin() {
    document.getElementById('signinForm').style.display = '';
    document.getElementById('emailFallbackWrap').style.display = 'none';
    document.getElementById('lineSep').textContent = 'หรือเข้าสู่ระบบด้วยอีเมล';
    document.getElementById('siEmail').focus();
  }
  async function sendLineOtp() {
    const email = document.getElementById('liEmail').value.trim();
    if (!email) return showAlert('กรุณากรอกอีเมล');
    const btn = document.getElementById('btnLineOtp'); btn.disabled = true; const t = btn.textContent; btn.textContent = 'กำลังส่ง…';
    try { await apiFetch('/line/send-otp', { method: 'POST', body: { email } }); showAlert('ส่งรหัส OTP ไปที่อีเมลแล้ว', 'success'); }
    catch (e) { showAlert(e.message); }
    finally { btn.disabled = false; btn.textContent = t; }
  }
  async function handleLineComplete(e) {
    e.preventDefault();
    const email = document.getElementById('liEmail').value.trim();
    const code  = document.getElementById('liCode').value.trim();
    try {
      const d = await apiFetch('/line/complete', { method: 'POST', body: { pending: LINE_PENDING, email, code } });
      localStorage.setItem(TOKEN_KEY, d.token);
      window.location.href = nextDest();
    } catch (err) { showAlert(err.message); shakeCard(); }
  }

  // hide the LINE button when the server has no LINE channel configured
  fetch(API + '/line/status').then(r => r.json()).then(d => {
    if (!d.enabled) ['btnLine', 'lineSep'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
  }).catch(() => {});

  // handle the redirect coming back from LINE
  (function handleLineHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get('line_token')) {
      localStorage.setItem(TOKEN_KEY, h.get('line_token'));
      history.replaceState(null, '', location.pathname);
      window.location.href = nextDest();
    } else if (h.get('line_pending')) {
      LINE_PENDING = h.get('line_pending');
      history.replaceState(null, '', location.pathname);
      showLineStep();
    } else if (h.get('line_error')) {
      const code = h.get('line_error');
      history.replaceState(null, '', location.pathname);
      const hint = {
        notconfigured: 'ระบบยังไม่ได้ตั้งค่า LINE (env)',
        token: 'Channel ID/Secret หรือ Callback URL ไม่ตรงกับที่ตั้งใน LINE',
        badstate: 'เซสชันหมดอายุ ลองใหม่อีกครั้ง',
        nocode: 'ไม่ได้รับ code จาก LINE',
        profile: 'ดึงโปรไฟล์ LINE ไม่สำเร็จ',
        server: 'เกิดข้อผิดพลาดฝั่งเซิร์ฟเวอร์',
      }[code] || '';
      showAlert('เข้าสู่ระบบด้วย LINE ไม่สำเร็จ [' + code + ']' + (hint ? ' — ' + hint : ''));
    }
  })();
</script>
</body>
</html>
